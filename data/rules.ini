; Woof Cleaner rules - original rule set written for this project.
; The format is described in docs/HOW_IT_WORKS.md.
; Add your own [Sections]; no code changes needed.
;
; Browser history, download history, cookies and form data use the Chromium*/Firefox* actions: they delete
; database rows (bookmarks and allowlisted cookies are kept) instead of whole files.

[Rule Vars]
CHROME_PROFILES=%localappdata%\Google\Chrome\User Data\Default,%localappdata%\Google\Chrome\User Data\Profile*
EDGE_PROFILES=%localappdata%\Microsoft\Edge\User Data\Default,%localappdata%\Microsoft\Edge\User Data\Profile*
BRAVE_PROFILES=%localappdata%\BraveSoftware\Brave-Browser\User Data\Default,%localappdata%\BraveSoftware\Brave-Browser\User Data\Profile*
VIVALDI_PROFILES=%localappdata%\Vivaldi\User Data\Default,%localappdata%\Vivaldi\User Data\Profile*
OPERA_PROFILES=%appdata%\Opera Software\Opera Stable,%appdata%\Opera Software\Opera Stable\Default
OPERA_CACHE=%localappdata%\Opera Software\Opera Stable,%localappdata%\Opera Software\Opera Stable\Default
OPERAGX_PROFILES=%appdata%\Opera Software\Opera GX Stable,%appdata%\Opera Software\Opera GX Stable\Default
OPERAGX_CACHE=%localappdata%\Opera Software\Opera GX Stable,%localappdata%\Opera Software\Opera GX Stable\Default
FIREFOX_PROFILES=%localappdata%\Mozilla\Firefox\Profiles\*
FIREFOX_DATA=%appdata%\Mozilla\Firefox\Profiles\*
CLAUDE_DATA=%appdata%\Claude,%localappdata%\Packages\Claude_*\LocalCache\Roaming\Claude

; ---------------------------------------------------------------- System

[Temporary Files (older than 24h)]
ID=windows.tempfiles
Group=System
Default=True
OnFile1=*|FileDeleteIfOlderThan|24hours
FileKey1=%TEMP%|*|RECURSE
FileKey2=%windir%\Temp|*|RECURSE

[Recycle Bin]
ID=windows.recyclebin
Group=System
Default=True
Action1=EmptyRecycleBin

[Clipboard]
ID=windows.clipboard
Group=System
Default=False
Action1=CleanClipboard

[Memory Dumps]
ID=windows.memorydumps
Group=System
Default=True
FileKey1=%windir%|memory.dmp
FileKey2=%windir%\Minidump|*.dmp
FileKey3=%windir%\LiveKernelReports|*.dmp|RECURSE
FileKey4=%LocalAppData%\CrashDumps|*.dmp

[Windows Error Reporting]
ID=windows.errorreporting
Group=System
Default=False
FileKey1=%ProgramData%\Microsoft\Windows\WER\ReportArchive|*|RECURSE
FileKey2=%ProgramData%\Microsoft\Windows\WER\ReportQueue|*|RECURSE
FileKey3=%LocalAppData%\Microsoft\Windows\WER\ReportArchive|*|RECURSE
FileKey4=%LocalAppData%\Microsoft\Windows\WER\ReportQueue|*|RECURSE
FileKey5=%LocalAppData%\Microsoft\Windows\WER\Temp|*|RECURSE

[Old Prefetch Data (older than 14 days)]
ID=windows.oldprefetchdata
Group=System
Default=False
NeedsAdmin=True
Warning=Windows rebuilds prefetch data; the first launch of apps may be slightly slower.
OnFile1=*|FileDeleteIfOlderThan|14days
FileKey1=%windir%\Prefetch|*.pf

[Thumbnail Cache]
ID=windows.thumbnailcache
Group=System
Default=True
FileKey1=%LocalAppData%\Microsoft\Windows\Explorer|thumbcache_*.db;iconcache_*.db

[DirectX Shader Cache]
ID=windows.directxshadercache
Group=System
Default=True
FileKey1=%LocalAppData%\D3DSCache|*|RECURSE

[Delivery Optimization Cache]
ID=windows.deliveryoptimization
Group=System
Default=False
NeedsAdmin=True
FileKey1=%windir%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache|*|RECURSE

[Recent Documents]
ID=windows.recentdocuments
Group=System
Default=False
FileKey1=%Recent%|*.lnk
Action1=ShellAddToRecentDocs

[DNS Cache]
ID=windows.dnscache
Group=System
Default=False
Action1=CleanDNSCache

; ---------------------------------------------------------------- Browsers

[Windows Event Logs]
ID=windows.eventlogs
Group=System
Default=False
NeedsAdmin=True
Warning=All Windows event logs are cleared. They are used to troubleshoot problems; keep them if you are diagnosing an issue.
Action1=CleanWindowsEventLogs

[Windows Update Download Cache]
ID=windows.updatecache
Group=System
Default=False
NeedsAdmin=True
Warning=Only clean this when no Windows Update is pending; downloaded updates will be downloaded again.
FileKey1=%windir%\SoftwareDistribution\Download|*|RECURSE

[Windows Log Files]
ID=windows.logfiles
Group=System
Default=False
NeedsAdmin=True
OnFile1=*|FileDeleteIfOlderThan|7days
FileKey1=%windir%\Logs\CBS|*.log;*.cab
FileKey2=%windir%\Logs\DISM|*.log
FileKey3=%windir%\Logs\WindowsUpdate|*.etl

[GPU Shader Cache (NVIDIA / AMD)]
ID=windows.gpushadercache
Group=System
Default=False
DetectFile1=%LocalAppData%\NVIDIA
DetectFile2=%LocalAppData%\AMD
FileKey1=%LocalAppData%\NVIDIA\DXCache|*|RECURSE
FileKey2=%LocalAppData%\NVIDIA\GLCache|*|RECURSE
FileKey3=%LocalAppData%\AMD\DxCache|*|RECURSE
FileKey4=%LocalAppData%\AMD\DxcCache|*|RECURSE

[Downloads Folder (older than 30 days)]
ID=windows.downloads
Group=Windows Downloads
Default=False
Warning=Files in your Downloads folder that are older than 30 days are deleted permanently. Move anything you want to keep first.
OnFile1=*|FileDeleteIfOlderThan|30days
FileKey1=%userprofile%\Downloads|*|RECURSE

; ---------------------------------------------------------------- Windows Store

[Microsoft Store - Cache]
ID=winstore.cache
Group=Windows Store
Default=False
ActiveProcesses=WinStore.App.exe
DetectFile1=%LocalAppData%\Packages\Microsoft.WindowsStore_8wekyb3d8bbwe
FileKey1=%LocalAppData%\Packages\Microsoft.WindowsStore_8wekyb3d8bbwe\LocalCache|*|RECURSE
FileKey2=%LocalAppData%\Packages\Microsoft.WindowsStore_8wekyb3d8bbwe\AC\INetCache|*|RECURSE

[Store Apps - Temporary Files]
ID=winstore.apptemp
Group=Windows Store
Default=False
FileKey1=%LocalAppData%\Packages\*\AC\Temp|*|RECURSE
FileKey2=%LocalAppData%\Packages\*\TempState|*|RECURSE

