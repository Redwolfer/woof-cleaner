; PyCleaner rules - original rule set written for this project, using the same
; declarative format CCleaner 7 uses (see docs/HOW_CCLEANER_WORKS.md).
; Add your own [Sections]; no code changes needed.

[Rule Vars]
CHROME_PROFILES=%localappdata%\Google\Chrome\User Data\Default,%localappdata%\Google\Chrome\User Data\Profile*
EDGE_PROFILES=%localappdata%\Microsoft\Edge\User Data\Default,%localappdata%\Microsoft\Edge\User Data\Profile*
BRAVE_PROFILES=%localappdata%\BraveSoftware\Brave-Browser\User Data\Default,%localappdata%\BraveSoftware\Brave-Browser\User Data\Profile*
FIREFOX_PROFILES=%localappdata%\Mozilla\Firefox\Profiles\*

; ---------------------------------------------------------------- System

[Temporary Files (older than 24h)]
ID=windows.tempfiles
Group=System
Default=True
OnFile1=*|FileDeleteIfOlderThan|24hours
FileKey1=%TEMP%|*|RECURSE
FileKey2=%windir%\Temp|*|RECURSE

[Recycle Bin]
ID=windows.recyclebin
Group=System
Default=True
Action1=EmptyRecycleBin

[Clipboard]
ID=windows.clipboard
Group=System
Default=False
Action1=CleanClipboard

[Memory Dumps]
ID=windows.memorydumps
Group=System
Default=True
FileKey1=%windir%|memory.dmp
FileKey2=%windir%\Minidump|*.dmp
FileKey3=%windir%\LiveKernelReports|*.dmp|RECURSE
FileKey4=%LocalAppData%\CrashDumps|*.dmp

[Windows Error Reporting]
ID=windows.errorreporting
Group=System
Default=False
FileKey1=%ProgramData%\Microsoft\Windows\WER\ReportArchive|*|RECURSE
FileKey2=%ProgramData%\Microsoft\Windows\WER\ReportQueue|*|RECURSE
FileKey3=%LocalAppData%\Microsoft\Windows\WER\ReportArchive|*|RECURSE
FileKey4=%LocalAppData%\Microsoft\Windows\WER\ReportQueue|*|RECURSE
FileKey5=%LocalAppData%\Microsoft\Windows\WER\Temp|*|RECURSE

[Old Prefetch Data (older than 14 days)]
ID=windows.oldprefetchdata
Group=System
Default=False
NeedsAdmin=True
Warning=Windows rebuilds prefetch data; the first launch of apps may be slightly slower.
OnFile1=*|FileDeleteIfOlderThan|14days
FileKey1=%windir%\Prefetch|*.pf

[Thumbnail Cache]
ID=windows.thumbnailcache
Group=System
Default=True
FileKey1=%LocalAppData%\Microsoft\Windows\Explorer|thumbcache_*.db;iconcache_*.db

[DirectX Shader Cache]
ID=windows.directxshadercache
Group=System
Default=True
FileKey1=%LocalAppData%\D3DSCache|*|RECURSE

[Delivery Optimization Cache]
ID=windows.deliveryoptimization
Group=System
Default=False
NeedsAdmin=True
FileKey1=%windir%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache|*|RECURSE

[Recent Documents]
ID=windows.recentdocuments
Group=System
Default=False
FileKey1=%Recent%|*.lnk
Action1=ShellAddToRecentDocs

[DNS Cache]
ID=windows.dnscache
Group=System
Default=False
Action1=CleanDNSCache

; ---------------------------------------------------------------- Browsers

[Google Chrome - Cache]
ID=google-chrome.cache
Group=Browsers
Default=True
ActiveProcesses=chrome.exe
DetectFile1=<CHROME_PROFILES>
FileKey1=<CHROME_PROFILES>\Cache|*|RECURSE
FileKey2=<CHROME_PROFILES>\Code Cache|*|RECURSE
FileKey3=<CHROME_PROFILES>\GPUCache|*|RECURSE
FileKey4=<CHROME_PROFILES>\Service Worker\CacheStorage|*|RECURSE

[Google Chrome - Cookies]
ID=google-chrome.cookies
Group=Browsers
Default=False
Warning=You will be signed out of websites.
ActiveProcesses=chrome.exe
DetectFile1=<CHROME_PROFILES>
FileKey1=<CHROME_PROFILES>\Network|Cookies;Cookies-journal

[Microsoft Edge - Cache]
ID=edge.cache
Group=Browsers
Default=True
ActiveProcesses=msedge.exe
DetectFile1=<EDGE_PROFILES>
FileKey1=<EDGE_PROFILES>\Cache|*|RECURSE
FileKey2=<EDGE_PROFILES>\Code Cache|*|RECURSE
FileKey3=<EDGE_PROFILES>\GPUCache|*|RECURSE
FileKey4=<EDGE_PROFILES>\Service Worker\CacheStorage|*|RECURSE

[Brave - Cache]
ID=brave.cache
Group=Browsers
Default=True
ActiveProcesses=brave.exe
DetectFile1=<BRAVE_PROFILES>
FileKey1=<BRAVE_PROFILES>\Cache|*|RECURSE
FileKey2=<BRAVE_PROFILES>\Code Cache|*|RECURSE
FileKey3=<BRAVE_PROFILES>\GPUCache|*|RECURSE

[Mozilla Firefox - Cache]
ID=firefox.cache
Group=Browsers
Default=True
ActiveProcesses=firefox.exe
DetectFile1=<FIREFOX_PROFILES>
FileKey1=<FIREFOX_PROFILES>\cache2|*|RECURSE
FileKey2=<FIREFOX_PROFILES>\startupCache|*|RECURSE

; ---------------------------------------------------------------- Applications

[Discord - Cache]
ID=discord.cache
Group=Applications
Default=True
ActiveProcesses=Discord.exe
DetectFile1=%appdata%\discord
FileKey1=%appdata%\discord\Cache|*|RECURSE
FileKey2=%appdata%\discord\Code Cache|*|RECURSE
FileKey3=%appdata%\discord\GPUCache|*|RECURSE

[Spotify - Cache]
ID=spotify.cache
Group=Applications
Default=False
ActiveProcesses=Spotify.exe
DetectFile1=%localappdata%\Spotify
FileKey1=%localappdata%\Spotify\Storage|*|RECURSE
FileKey2=%localappdata%\Spotify\Data|*|RECURSE

[Microsoft Teams (classic) - Cache]
ID=teams.cache
Group=Applications
Default=False
ActiveProcesses=Teams.exe
DetectFile1=%appdata%\Microsoft\Teams
FileKey1=%appdata%\Microsoft\Teams\Cache|*|RECURSE
FileKey2=%appdata%\Microsoft\Teams\Code Cache|*|RECURSE
FileKey3=%appdata%\Microsoft\Teams\GPUCache|*|RECURSE

; ---------------------------------------------------------------- Developer

[npm Cache]
ID=dev.npmcache
Group=Developer
Default=False
DetectFile1=%localappdata%\npm-cache
FileKey1=%localappdata%\npm-cache\_cacache|*|RECURSE

[pip Cache]
ID=dev.pipcache
Group=Developer
Default=False
DetectFile1=%localappdata%\pip\Cache
FileKey1=%localappdata%\pip\Cache|*|RECURSE

[NuGet HTTP Cache]
ID=dev.nugetcache
Group=Developer
Default=False
DetectFile1=%localappdata%\NuGet\v3-cache
FileKey1=%localappdata%\NuGet\v3-cache|*|RECURSE

; ---------------------------------------------------------------- Registry (HKCU only)

[Run Dialog History]
ID=registry.rundialog
Group=Registry
Default=False
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU

[Explorer Typed Paths]
ID=registry.typedpaths
Group=Registry
Default=False
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths

[Explorer Search History]
ID=registry.wordwheel
Group=Registry
Default=False
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\WordWheelQuery
